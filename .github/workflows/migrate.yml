# Data migration: Supabase → D1 + R2, runnable entirely from the GitHub website
# (Actions → "Data migration" → Run workflow). No local tooling needed.
#
# Two modes:
#   plan  — export + build import + full LOCAL rehearsal + clip dry-run.
#           Writes nothing to production. Run this first; check the log.
#   apply — everything in plan, then writes production D1 + R2 and verifies.
#
# Required repo secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_URL                e.g. https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   service_role key (delete the secret after a green apply)
#   CLOUDFLARE_API_TOKEN        needs Pages edit + D1 edit + R2 edit
#   CLOUDFLARE_ACCOUNT_ID
# Prereq: D1 database + R2 bucket exist and wrangler.toml carries the real
# database_id (already committed), and the D1 schema was applied (the Deploy
# workflow does that on every merge).
#
# NOTE: this workflow only becomes visible/runnable once it is on the default
# branch (main) — i.e. after PR #7 is merged. Run plan, then apply, right
# after merging, BEFORE anyone opens the dashboard.

name: Data migration (Supabase → D1/R2)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '"plan" = dry run, nothing written to production · "apply" = writes production D1 + R2'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm ci

      - name: Preflight — required secrets present
        run: |
          missing=0
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret: $v"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "Add the missing secrets under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          if grep -q REPLACE_WITH_D1_DATABASE_ID wrangler.toml; then
            echo "::error::wrangler.toml still contains REPLACE_WITH_D1_DATABASE_ID — create the D1 database and commit the real id first."
            exit 1
          fi

      - name: Export from Supabase
        run: node scripts/export-supabase.mjs

      - name: Build D1 import SQL
        run: node scripts/import-d1.mjs

      - name: LOCAL rehearsal (schema → import → verify)
        run: |
          rm -rf .wrangler/state
          npx wrangler d1 migrations apply nappavt-growth-hub --local
          npx wrangler d1 execute nappavt-growth-hub --local --file=migration-data/d1-import.sql
          node scripts/verify-migration.mjs --local

      - name: Clip migration — plan
        run: node scripts/migrate-clips.mjs

      - name: APPLY — reset + import production D1
        if: ${{ inputs.mode == 'apply' }}
        run: |
          echo "::warning::APPLY mode — writing production D1 and R2 now."
          # Deterministic cutover: clear growth-hub rows so the import lands on a
          # clean database even if someone opened the empty post-merge dashboard.
          npx wrangler d1 execute nappavt-growth-hub --remote --command "DELETE FROM growth_hub_advisor_notes; DELETE FROM growth_hub_members; DELETE FROM growth_hub_invites; DELETE FROM dashboard_state; DELETE FROM hub_meta; DELETE FROM users;"
          npx wrangler d1 execute nappavt-growth-hub --remote --file=migration-data/d1-import.sql

      - name: APPLY — migrate legacy clips to R2
        if: ${{ inputs.mode == 'apply' }}
        run: node scripts/migrate-clips.mjs --apply

      - name: APPLY — verify production
        if: ${{ inputs.mode == 'apply' }}
        run: |
          node scripts/verify-migration.mjs
          echo "::notice::Production migration verified (row counts, blob hashes, timestamps, clips). Once stable for 2+ weeks: delete the SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repo secrets, then the Supabase project."
