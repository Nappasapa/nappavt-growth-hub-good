name: Deploy NappaVT Growth Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dashboard
        run: |
          mkdir -p dist/privacy
          mkdir -p dist/terms

          cp index.html dist/index.html
          cp tiktokbSoGYzHe5aeNCnsrhIKFW8BguLbCIJxy.txt dist/
          cp privacy/index.html dist/privacy/index.html
          cp terms/index.html dist/terms/index.html

          # Pages Functions: the Growth Hub API lives next to the static site.
          # Paths /api/* are served by these functions; everything else falls
          # through to the static assets.
          cp -r functions dist/functions

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply nappavt-growth-hub --remote

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nappavt-growth-hub --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
