name: CI — tests & build

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: growthhub_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_DSN: mysql://root:ci-root-password@127.0.0.1:3306/growthhub_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci && npm --prefix .test ci

      - name: Syntax check all backend files
        run: |
          for f in server/*.mjs server/routes/*.mjs scripts/*.mjs; do
            node --check "$f" || exit 1
          done

      - name: Run test suite (unit + dom + integration w/ MariaDB service)
        run: npm test

      - name: Assemble frontend artifact
        run: |
          mkdir -p dist/privacy dist/terms
          cp index.html dist/index.html
          cp tiktokbSoGYzHe5aeNCnsrhIKFW8BguLbCIJxy.txt dist/
          cp privacy/index.html dist/privacy/index.html
          cp terms/index.html dist/terms/index.html

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: growthhub-frontend
          path: dist
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build backend image (proves Dockerfile)
        run: docker build -t growthhub-backend:ci .
