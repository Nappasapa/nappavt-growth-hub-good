name: CI — tests & build

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: growthhub_ci
          MARIADB_USER: growthhub_ci
          MARIADB_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_DSN: mysql://growthhub_ci:ci-app-password@127.0.0.1:3306/growthhub_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (root)
        run: npm --version && node --version && npm ci

      - name: Install dependencies (test suite)
        run: npm --prefix .test ci

      - name: Syntax check all backend files
        run: |
          for f in server/*.mjs server/routes/*.mjs scripts/*.mjs; do
            node --check "$f" || exit 1
          done

      - name: Run test suite (unit + dom + integration w/ MariaDB service)
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/gh-test.log || {
            grep -aE "FAIL - |not ok |Error|CRASH|Suite|smoke|dsn|integrations?" /tmp/gh-test.log \
              | grep -avE "^\s*$" | head -8 | while IFS= read -r line; do
              msg=$(echo "$line" | sed -e 's/%/%25/g' -e $'s/\r/%0D/g' -e $'s/\n/%0A/g' | cut -c1-400)
              printf '::error title=test-failure::%s\n' "$msg"
            done
            {
              echo '## Test suite output (tail)';
              echo '```';
              tail -250 /tmp/gh-test.log;
              echo '```';
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Assemble frontend artifact
        run: |
          mkdir -p dist/privacy dist/terms
          cp index.html dist/index.html
          cp tiktokbSoGYzHe5aeNCnsrhIKFW8BguLbCIJxy.txt dist/
          cp privacy/index.html dist/privacy/index.html
          cp terms/index.html dist/terms/index.html

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: growthhub-frontend
          path: dist
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build backend image (proves Dockerfile)
        run: docker build -t growthhub-backend:ci .
